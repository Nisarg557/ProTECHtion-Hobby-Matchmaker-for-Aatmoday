<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Details - Aatmoday</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="clubs.css">
    <link rel="stylesheet" href="club-details.css">
</head>
<body>
    <!-- Shared Navbar -->
    <nav class="navbar">
        <div class="nav-logo">Aatmoday<span class="dot">.</span></div>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="advisor.html">Advisor</a>
            <a href="clubs.html">Clubs</a>
            <a href="about.html">About</a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="club-details-container" id="club-content">
        <div class="loading-state">Loading club details...</div>
    </main>

    <!-- Global Enroll Modal -->
    <div id="enroll-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Enroll Now</h2>
            <p>Join the <strong id="modal-club-name-display"></strong></p>
            
            <form id="enroll-form" onsubmit="submitForm(event)">
                <!-- Traces back the request to the specific club -->
                <input type="hidden" id="enroll-club-id" name="club_id">
                
                <div class="form-group">
                    <label for="student-name">Full Name</label>
                    <input type="text" id="student-name" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="student-email">Email Address</label>
                    <input type="email" id="student-email" required placeholder="Enter your student email">
                </div>
                <div class="form-group">
                    <label for="student-dept">Department</label>
                    <input type="text" id="student-dept" required placeholder="e.g., B.Tech CSE">
                </div>
                <button type="submit" class="btn-primary">Submit Application</button>
            </form>
        </div>
    </div>

    <script src="club.js"></script>
</body>
</html>
